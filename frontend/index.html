<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// Theme sofort setzen (vor dem ersten Zeichnen, kein Aufblitzen)
(function(){var m='auto';try{m=localStorage.getItem('fm-theme')||'auto'}catch(e){}
var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<style>
/* Kritisches CSS: Startbildschirm muss sofort stehen, bevor der Rest geladen ist */
html{background:#efb6d5}html[data-theme=dark]{background:#1a0f17}
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;overflow:hidden;--wails-draggable:drag;
 font-family:Manrope,system-ui,sans-serif;color:#3a2433;
 background:linear-gradient(135deg,#fbe0ef 0%,#efb6d5 48%,#d7bdf2 100%);
 transition:opacity .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1),filter .7s}
html[data-theme=dark] #splash{color:#fbeef6;background:linear-gradient(135deg,#1a0f17 0%,#2b1626 52%,#1b1530 100%)}
#splash.out{opacity:0;transform:scale(1.06);filter:blur(10px);pointer-events:none}
#splash.gone{display:none}
.sp-bg{position:absolute;inset:0;overflow:hidden}
.sp-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
.sp-bg .b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#ff9fcf;animation:spA 14s ease-in-out infinite alternate}
.sp-bg .b2{width:40vmax;height:40vmax;right:-10vmax;bottom:-16vmax;background:#b79cf2;animation:spB 17s ease-in-out infinite alternate}
.sp-bg .b3{width:26vmax;height:26vmax;left:38%;top:48%;background:#ffd0a6;opacity:.5;animation:spC 12s ease-in-out infinite alternate}
html[data-theme=dark] .sp-bg i{opacity:.45}
html[data-theme=dark] .sp-bg .b1{background:#b3418a}html[data-theme=dark] .sp-bg .b2{background:#4b3a9e}html[data-theme=dark] .sp-bg .b3{background:#7a3a5a;opacity:.35}
@keyframes spA{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes spB{to{transform:translate(-12vmax,-12vmax) scale(1.2)}}
@keyframes spC{to{transform:translate(-14vmax,-8vmax) scale(.8)}}
.sp-grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.sp-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.sp-logo{width:116px;height:116px;filter:drop-shadow(0 18px 38px rgba(142,61,114,.45));animation:spPop .9s cubic-bezier(.2,1.3,.3,1) both,spFloat 4.5s ease-in-out 1s infinite}
@keyframes spPop{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes spFloat{50%{transform:translateY(-6px)}}
.sp-ring{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw 1.1s .35s cubic-bezier(.5,0,.2,1) forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
.sp-needle{transform-origin:48px 48px;animation:spNeedle 1.5s .7s cubic-bezier(.2,1.4,.35,1) both}
@keyframes spNeedle{from{transform:rotate(-200deg);opacity:0}to{transform:rotate(45deg);opacity:1}}
.sp-orbit{transform-origin:48px 48px;animation:spOrbit 2.6s .9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes spOrbit{to{transform:rotate(360deg)}}
.sp-name{margin:26px 0 0;font-size:40px;font-weight:800;letter-spacing:-.02em;display:flex}
.sp-name span{display:inline-block;opacity:0;transform:translateY(18px);animation:spRise .6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes spRise{to{opacity:1;transform:none}}
.sp-tag{margin:6px 0 0;font-size:14px;font-weight:600;letter-spacing:.04em;opacity:0;animation:spFade .8s 1.15s forwards;color:#6f5264}
html[data-theme=dark] .sp-tag{color:#c7a9bb}
@keyframes spFade{to{opacity:1}}
.sp-bar{margin-top:34px;width:230px;height:5px;border-radius:3px;background:rgba(58,36,51,.14);overflow:hidden;opacity:0;animation:spFade .6s 1.2s forwards}
html[data-theme=dark] .sp-bar{background:rgba(255,255,255,.14)}
.sp-bar i{display:block;height:100%;width:6%;border-radius:3px;background:linear-gradient(90deg,#c25a9b,#8e3d72);transition:width .5s cubic-bezier(.3,.8,.3,1);position:relative;overflow:hidden}
html[data-theme=dark] .sp-bar i{background:linear-gradient(90deg,#f2a6d3,#d27cb0)}
.sp-bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:spShine 1.4s linear infinite}
@keyframes spShine{to{transform:translateX(100%)}}
.sp-status{margin:14px 0 0;height:18px;font-size:12.5px;font-weight:700;color:#6f5264;opacity:0;animation:spFade .6s 1.3s forwards;transition:none}
html[data-theme=dark] .sp-status{color:#b99dae}
.sp-status.sw{animation:none;opacity:1;animation:spSwap .35s ease}
@keyframes spSwap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sp-bg i,.sp-logo,.sp-needle,.sp-orbit,.sp-bar i:after{animation:none!important}.sp-name span,.sp-tag,.sp-bar,.sp-status{animation:none!important;opacity:1;transform:none}.sp-ring{animation:none;stroke-dashoffset:0}#splash,#splash.out{transition:opacity .3s;transform:none;filter:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i><div class="sp-grain"></div></div>
  <div class="sp-c">
    <svg class="sp-logo" viewBox="0 0 96 96" role="img" aria-label="Browser">
      <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9fd0"/><stop offset="1" stop-color="#a1347f"/></linearGradient>
      <linearGradient id="spgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect x="4" y="4" width="88" height="88" rx="28" fill="url(#spg)"/>
      <rect x="4" y="4" width="88" height="88" rx="28" fill="url(#spgl)"/>
      <circle class="sp-ring" cx="48" cy="48" r="27" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" pathLength="100" transform="rotate(-90 48 48)"/>
      <g class="sp-needle"><path d="M48 25 L55.5 48 L48 48 Z" fill="#fff"/><path d="M48 71 L40.5 48 L48 48 Z" fill="#fff"/><path d="M48 25 L40.5 48 L48 48 Z" fill="#fff" opacity=".55"/><path d="M48 71 L55.5 48 L48 48 Z" fill="#fff" opacity=".55"/></g>
      <g class="sp-orbit"><circle cx="48" cy="19" r="3.6" fill="#fff"/></g>
    </svg>
    <h1 class="sp-name" aria-hidden="true"><span style="animation-delay:.55s">B</span><span style="animation-delay:.6s">r</span><span style="animation-delay:.65s">o</span><span style="animation-delay:.7s">w</span><span style="animation-delay:.75s">s</span><span style="animation-delay:.8s">e</span><span style="animation-delay:.85s">r</span></h1>
    <p class="sp-tag">Dein Fenster ins Web</p>
    <div class="sp-bar"><i id="spBar"></i></div>
    <p class="sp-status" id="spStatus">Starte …</p>
  </div>
</div>
<div id="app">
  <div id="titlebar"><div id="tabs" role="tablist" aria-label="Offene Tabs"></div></div>
  <div id="body">
    <div id="main">
      <div id="panel">
        <div id="toolbar">
          <button class="ib" id="bBack" data-act="back" aria-label="Zurück"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="ib" id="bFwd" data-act="forward" aria-label="Vor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="ib" id="bReload" data-act="reload" aria-label="Neu laden"></button>
          <div id="urlbox">
            <span id="lock"></span>
            <input id="url" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Suchen oder Adresse eingeben" aria-label="Adresse">
            <button class="ib sm" id="bStar" data-act="star" aria-label="Lesezeichen"></button>
          </div>
          <div id="spChip"></div>
          <button class="ib" id="bSide" data-act="toggle-side" aria-label="Seitenleiste"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
          <button class="ib" id="bMenu" data-act="menu" aria-label="Menü"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
        <div id="progress"><div></div></div>
        <div id="bmbar" hidden></div>
        <div id="findbar" hidden>
          <input id="findIn" type="text" placeholder="Auf der Seite suchen" spellcheck="false" aria-label="Auf der Seite suchen">
          <span id="findStat"></span>
          <button class="ib sm" data-act="find-prev" aria-label="Vorheriger Treffer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <button class="ib sm" data-act="find-next" aria-label="Nächster Treffer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button class="btn" data-act="find-close">Fertig</button>
        </div>
        <div id="page">
          <div id="start"></div>
          <div id="searchView" hidden></div>
          <div id="settingsView" hidden></div>
          <img id="pageShot" alt="" hidden>
        </div>
      </div>
    </div>
    <aside id="side" hidden aria-label="Seitenleiste"></aside>
  </div>
</div>
<div id="spPop" class="spPop" hidden role="dialog" aria-label="Spotify Mini-Player"><div class="pBody"></div><i class="pFl"></i><i class="pFr"></i></div>
<div id="spotify-ov" hidden role="dialog" aria-label="Spotify"></div>
<div id="sugg" hidden></div>
<div id="menu"></div>
<div id="toast" role="status"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
